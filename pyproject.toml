[project]
name = "feedback-insights"
version = "0.1.0"
description = "Ask plain-English questions about open-ended feedback; get themes backed by cited comments."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
fetch = ["datasets>=2.19"]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["feedback_insights"]

[tool.pytest.ini_options]
testpaths = ["tests"]
